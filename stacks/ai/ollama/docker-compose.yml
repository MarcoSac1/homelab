services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1        # max 1 richiesta in parallelo
      - OLLAMA_MAX_LOADED_MODELS=1   # tieni 1 solo modello in memoria
      - OLLAMA_NUM_THREADS=3         # usa 3 thread invece di saturare 2
    volumes:
      - ollama-data:/root/.ollama
    cpus: "3.0"          # ← era 2.0, ora 3 core con limite Docker
    mem_limit: 4g
    cpu_shares: 512      # ← priorità CPU ridotta rispetto al sistema (default 1024)
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      start_period: 120s
      retries: 5
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

volumes:
  ollama-data:
