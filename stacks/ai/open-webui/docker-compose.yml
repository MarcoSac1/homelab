services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
      - WEBUI_URL=https://openwebui.home.arpa
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

volumes:
  openwebui-data:
